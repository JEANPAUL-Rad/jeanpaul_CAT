
services:
  juice-shop:
    image: jeanpaul60001/juice-shop:1.0.0
    container_name: juice-shop
    restart: unless-stopped
    expose:
      - "3000"

  nginx:
    image: nginx:stable
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./ngnix.config:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - juice-shop

  mongodb:
    image: mongo:7
    container_name: mongodb-container
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
