apiVersion: apps/v1
kind: Deployment
metadata:
  name: jeanpaul-cat
  labels:
    app: jeanpaul-cat
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jeanpaul-cat
  template:
    metadata:
      labels:
        app: jeanpaul-cat
    spec:
      containers:
        - name: juice-shop
          image: jeanpaul60001/jeanpaul-cat:v6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: jeanpaul-cat
spec:
  type: NodePort
  selector:
    app: jeanpaul-cat
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
